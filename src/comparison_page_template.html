  <span class="brand-divider" aria-hidden="true"></span>
  <div class="page-identity"><b id="pageTitle">复刻对比</b><span id="pageSubtitle"></span></div>
  <div class="top-actions"><span class="save-state" id="saveState">审核未修改</span><button class="quiet-button" id="alignmentButton" type="button">修正对应</button><button class="primary-button" id="saveReviewButton" type="button">保存审核</button></div>
</header>
<div class="status-banner" id="statusBanner" role="status" aria-live="polite"><b id="statusStage"></b><span id="statusDetail"></span><span id="statusProgress"></span></div>
<section class="summary-strip" aria-label="对比概览">
  <div class="summary-title"><b id="comparisonTitle"></b><span id="comparisonMeta"></span></div>
  <div class="summary-metric"><span>原片 / 复刻镜头</span><b id="shotCountMetric">—</b></div>
  <div class="summary-metric"><span>全片时长差</span><b id="durationMetric">—</b></div>
  <div class="summary-metric"><span>缺镜 / 增镜</span><b id="unmatchedMetric">—</b></div>
  <div class="summary-metric"><span>机械差异</span><b id="findingMetric">—</b></div>
</section>
<section class="monitor" id="monitor" data-orientation="landscape">
  <div class="monitor-head">
    <div class="pair-heading"><b id="monitorPairTitle">等待镜头对应</b><span id="monitorPairMeta"></span></div>
    <div class="monitor-modes">
      <div class="segmented" role="group" aria-label="画面对比方式"><button class="on" type="button" data-view-mode="side">并排</button><button type="button" data-view-mode="ab">A / B</button><button type="button" data-view-mode="overlay">叠加</button></div>
      <button class="monitor-tool" id="abSwitch" type="button" aria-pressed="false" title="在原片和复刻片之间切换">显示 A</button>
    </div>
  </div>
  <div class="players" id="players" data-mode="side" data-ab="source">
    <div class="player source" id="sourcePlayer"><span class="player-label">A · 原片</span><video id="sourceVideo" playsinline preload="metadata"></video><div class="player-empty">该对应没有原片镜头</div></div>
    <div class="player remake" id="remakePlayer"><span class="player-label">B · 复刻</span><video id="remakeVideo" playsinline preload="metadata"></video><div class="player-empty">该对应没有复刻镜头</div></div>
  </div>
  <div class="playback">
    <div class="transport"><button class="icon-button" id="playButton" type="button" aria-label="播放所选镜头" title="播放 / 暂停">▶</button><button class="icon-button" id="restartButton" type="button" aria-label="回到镜头开头" title="回到镜头开头">↶</button><span class="time-readout" id="timeReadout">00:00.000 / 00:00.000</span></div>
    <input class="phase-slider" id="phaseSlider" type="range" min="0" max="1000" value="0" aria-label="所选镜头播放进度">
    <div class="play-options">
      <select class="dark-select" id="syncMode" aria-label="同步方式"><option value="phase">按镜头阶段同步</option><option value="realtime">按真实时长同步</option></select>
      <select class="dark-select" id="speedSelect" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select>
      <select class="dark-select" id="audioMode" aria-label="监听声音"><option value="source">原片声音</option><option value="remake">复刻声音</option><option value="both">双轨声音</option><option value="mute">静音</option></select>
      <label class="overlay-control">复刻透明度 <input id="overlayOpacity" type="range" min="0" max="100" value="50"></label>
      <label class="loop-control"><input id="loopToggle" type="checkbox" checked>循环</label>
    </div>
  </div>
</section>
<nav class="tabs" aria-label="对比工作区">
  <button class="on" type="button" data-tab="shots">逐镜对照</button>
  <button type="button" data-tab="rhythm">全片节奏</button>
  <button type="button" data-tab="queue">修复队列</button>
  <button type="button" data-tab="tech">技术鉴定</button>
</nav>
<main class="tab-panel" id="tabPanel"></main>
<dialog class="dialog" id="alignmentDialog" aria-labelledby="alignmentTitle">
  <div class="dialog-head"><h2 id="alignmentTitle">修正镜头对应</h2><button class="dialog-close" id="closeAlignment" type="button" aria-label="关闭">×</button></div>
  <div class="dialog-body"><p class="dialog-note">每个原片镜头只能对应一个复刻镜头，并保持时间顺序。选择“缺失”表示复刻片没有该镜头；未被选择的复刻镜头会自动记为新增。</p><div id="alignmentEditor"></div><p class="dialog-error" id="alignmentError" hidden></p></div>
  <div class="dialog-actions"><button class="quiet-button" id="cancelAlignment" type="button">取消</button><button class="primary-button" id="applyAlignment" type="button">应用并重建证据</button></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.LAPIAN_COMPARISON = __COMPARISON_DATA__;</script>
<script>
__COMPARISON_APP_JS__
</script>
</body>
</html>
